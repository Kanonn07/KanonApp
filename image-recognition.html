<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>画像認識デモ</title>
  </head>
  <body>
    <main>
      <h1>画像認識デモ</h1>

      <p>画像を選ぶと、ブラウザ内のWebGPUで物体を検出します。</p>

      <p>
        <label for="image-file">画像</label>
        <input id="image-file" type="file" accept="image/*" />
      </p>

      <p>
        <label for="threshold">信頼度のしきい値</label>
        <input
          id="threshold"
          type="number"
          min="0"
          max="1"
          step="0.05"
          value="0.4"
        />
      </p>

      <p>
        <button id="detect" type="button" disabled>検出</button>
      </p>

      <p id="status" role="status" aria-live="polite">画像を選択してください。</p>
      <canvas id="preview" aria-label="検出結果"></canvas>
      <ul id="results" aria-label="検出した物体"></ul>
    </main>

    <script type="module">
      import {
        AutoModel,
        AutoProcessor,
        RawImage,
        env,
      } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

      env.allowLocalModels = false;

      const MODEL_ID = "onnx-community/yolov10n";
      const MAX_IMAGE_SIDE = 960;
      const fileInput = document.querySelector("#image-file");
      const thresholdInput = document.querySelector("#threshold");
      const detectButton = document.querySelector("#detect");
      const status = document.querySelector("#status");
      const preview = document.querySelector("#preview");
      const results = document.querySelector("#results");
      const previewContext = preview.getContext("2d");

      let sourceCanvas = null;
      let model = null;
      let processor = null;
      let modelPromise = null;
      let busy = false;
      let imageLoadToken = 0;

      if (!previewContext) {
        throw new Error("Canvas を利用できません");
      }

      function setStatus(message) {
        status.textContent = message;
      }

      function progressCallback(info) {
        if (info.status === "progress" && Number.isFinite(info.progress)) {
          const file = info.file ? `: ${info.file}` : "";
          setStatus(`モデルをダウンロード中 ${info.progress.toFixed(0)}%${file}`);
        } else if (info.status === "initiate") {
          setStatus(`モデルを準備中${info.file ? `: ${info.file}` : ""}`);
        }
      }

      async function requireWebGPU() {
        if (!navigator.gpu) {
          throw new Error("WebGPU が利用できません。WebGPU 対応ブラウザで開いてください。");
        }

        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          throw new Error("WebGPU adapter を取得できませんでした。");
        }

        return adapter;
      }

      async function ensureModel() {
        if (model && processor) {
          return;
        }

        if (!modelPromise) {
          modelPromise = (async () => {
            await requireWebGPU();
            setStatus("YOLOv10n を読み込んでいます。初回はモデルのダウンロードが必要です。");

            const loadedModel = await AutoModel.from_pretrained(MODEL_ID, {
              device: "webgpu",
              dtype: "q8",
              progress_callback: progressCallback,
            });

            try {
              const loadedProcessor = await AutoProcessor.from_pretrained(MODEL_ID);
              model = loadedModel;
              processor = loadedProcessor;
            } catch (error) {
              loadedModel.dispose?.();
              throw error;
            }
          })().catch((error) => {
            modelPromise = null;
            throw error;
          });
        }

        await modelPromise;
      }

      async function fileToCanvas(file) {
        if (!file || !file.type.startsWith("image/")) {
          throw new Error("画像ファイルを選択してください。");
        }

        const objectUrl = URL.createObjectURL(file);
        const image = new Image();

        try {
          image.src = objectUrl;
          await image.decode();
        } finally {
          URL.revokeObjectURL(objectUrl);
        }

        const scale = Math.min(
          1,
          MAX_IMAGE_SIDE / Math.max(image.naturalWidth, image.naturalHeight),
        );
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));

        const context = canvas.getContext("2d");
        if (!context) {
          throw new Error("画像用 Canvas を作成できませんでした。");
        }
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        return canvas;
      }

      function disposeTensorTree(value, seen = new Set()) {
        if (!value || typeof value !== "object" || seen.has(value)) return;
        seen.add(value);

        if (typeof value.dispose === "function") {
          value.dispose();
          return;
        }
        if (ArrayBuffer.isView(value) || value instanceof ArrayBuffer) return;
        if (Array.isArray(value)) {
          for (const item of value) disposeTensorTree(item, seen);
          return;
        }
        for (const item of Object.values(value)) disposeTensorTree(item, seen);
      }

      function drawDetections(detections) {
        preview.width = sourceCanvas.width;
        preview.height = sourceCanvas.height;
        previewContext.drawImage(sourceCanvas, 0, 0);
        previewContext.lineWidth = Math.max(2, sourceCanvas.width / 400);
        previewContext.font = `${Math.max(14, sourceCanvas.width / 50)}px sans-serif`;

        for (const detection of detections) {
          const { x, y, width, height, label, score } = detection;
          previewContext.strokeStyle = "#e11d48";
          previewContext.strokeRect(x, y, width, height);

          const text = `${label} ${(score * 100).toFixed(0)}%`;
          const textHeight = Math.max(18, sourceCanvas.width / 35);
          const textWidth = previewContext.measureText(text).width;
          const textY = Math.max(textHeight, y);
          previewContext.fillStyle = "#e11d48";
          previewContext.fillRect(x, textY - textHeight, textWidth + 8, textHeight);
          previewContext.fillStyle = "white";
          previewContext.fillText(text, x + 4, textY - 4);
        }
      }

      function showResults(detections) {
        results.replaceChildren();

        if (detections.length === 0) {
          const item = document.createElement("li");
          item.textContent = "しきい値以上の物体は検出されませんでした。";
          results.append(item);
          setStatus("検出が完了しました。物体は見つかりませんでした。");
          return;
        }

        const counts = new Map();
        for (const detection of detections) {
          counts.set(detection.label, (counts.get(detection.label) ?? 0) + 1);
          const item = document.createElement("li");
          item.textContent = `${detection.label}: ${(detection.score * 100).toFixed(1)}%`;
          results.append(item);
        }

        const summary = [...counts.entries()]
          .map(([label, count]) => `${label} ${count}個`)
          .join("、");
        setStatus(`${detections.length}件を検出しました: ${summary}`);
      }

      function parseDetections(output, activeProcessor, activeModel, threshold) {
        if (!output || output.dims.at(-1) !== 6) {
          const shape = output?.dims?.join(", ") ?? "不明";
          throw new Error(`YOLO の出力 shape が想定外です: [${shape}]`);
        }

        const [newHeight, newWidth] = activeProcessor.reshaped_input_sizes[0];
        const scaleX = sourceCanvas.width / newWidth;
        const scaleY = sourceCanvas.height / newHeight;
        const detections = [];
        const data = output.data;

        for (let offset = 0; offset < data.length; offset += 6) {
          const [xmin, ymin, xmax, ymax, score, classValue] = data.subarray(
            offset,
            offset + 6,
          );
          if (!Number.isFinite(score) || score < threshold) continue;

          const classId = Math.trunc(classValue);
          const rawLabel = activeModel.config.id2label?.[classId];
          const label = rawLabel ?? String(classId);
          const left = Math.max(0, Math.min(sourceCanvas.width, xmin * scaleX));
          const top = Math.max(0, Math.min(sourceCanvas.height, ymin * scaleY));
          const right = Math.max(0, Math.min(sourceCanvas.width, xmax * scaleX));
          const bottom = Math.max(0, Math.min(sourceCanvas.height, ymax * scaleY));

          if (right <= left || bottom <= top) continue;
          detections.push({
            x: left,
            y: top,
            width: right - left,
            height: bottom - top,
            label,
            score,
          });
        }

        return detections;
      }

      async function detect() {
        if (busy) return;
        if (!sourceCanvas) {
          setStatus("先に画像を選択してください。");
          return;
        }

        const threshold = Number(thresholdInput.value);
        if (!Number.isFinite(threshold) || threshold < 0 || threshold > 1) {
          setStatus("信頼度のしきい値は 0 から 1 の範囲で入力してください。");
          return;
        }

        busy = true;
        detectButton.disabled = true;
        fileInput.disabled = true;
        thresholdInput.disabled = true;
        results.replaceChildren();

        let processed = null;
        let output = null;
        try {
          await ensureModel();
          setStatus("画像を処理しています。");
          const rawImage = RawImage.fromCanvas(sourceCanvas);
          processed = await processor(rawImage);
          output = await model({ images: processed.pixel_values });

          const detections = parseDetections(
            output.output0,
            processed,
            model,
            threshold,
          );
          drawDetections(detections);
          showResults(detections);
        } catch (error) {
          console.error(error);
          setStatus(`エラー: ${error instanceof Error ? error.message : String(error)}`);
        } finally {
          disposeTensorTree(output);
          disposeTensorTree(processed);
          busy = false;
          detectButton.disabled = !sourceCanvas;
          fileInput.disabled = false;
          thresholdInput.disabled = false;
        }
      }

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files?.[0];
        if (!file) return;

        const token = ++imageLoadToken;
        detectButton.disabled = true;
        results.replaceChildren();
        setStatus("画像を読み込んでいます。");

        try {
          const nextCanvas = await fileToCanvas(file);
          if (token !== imageLoadToken) return;

          sourceCanvas = nextCanvas;
          preview.width = sourceCanvas.width;
          preview.height = sourceCanvas.height;
          previewContext.drawImage(sourceCanvas, 0, 0);
          detectButton.disabled = false;
          setStatus(`画像を読み込みました (${sourceCanvas.width} × ${sourceCanvas.height})。`);
        } catch (error) {
          if (token !== imageLoadToken) return;
          console.error(error);
          sourceCanvas = null;
          preview.width = 0;
          preview.height = 0;
          setStatus(`エラー: ${error instanceof Error ? error.message : String(error)}`);
        }
      });

      detectButton.addEventListener("click", detect);

      window.addEventListener("pagehide", () => {
        model?.dispose?.();
      });
    </script>
  </body>
</html>
